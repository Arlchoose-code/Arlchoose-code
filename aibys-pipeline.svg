<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-label="Animated Aibys model pipeline">
  <defs>
    <linearGradient id="abg" x2="1"><stop stop-color="#000"/><stop offset=".5" stop-color="#080d14"/><stop offset="1" stop-color="#06232b"/></linearGradient>
    <filter id="ag"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .m{font-family:'JetBrains Mono','Cascadia Code',monospace}.s{font-family:'Segoe UI',Arial,sans-serif}.line{stroke-dasharray:7 10;animation:move 3s linear infinite}.node{animation:n 3s ease-in-out infinite}.d2{animation-delay:.5s}.d3{animation-delay:1s}.d4{animation-delay:1.5s}.d5{animation-delay:2s}.dot{animation:travel 4s linear infinite}
      @keyframes move{to{stroke-dashoffset:-80}}@keyframes n{0%,100%{stroke:#164e63}50%{stroke:#22d3ee}}@keyframes travel{0%{transform:translateX(0)}100%{transform:translateX(760px)}}
    </style>
  </defs>
  <rect width="1000" height="250" rx="22" fill="url(#abg)" stroke="#164e63"/>
  <text x="45" y="42" class="m" fill="#22d3ee" font-size="13">// AIBYS OPEN MODEL PIPELINE</text>
  <text x="45" y="70" class="s" fill="#f8fafc" font-size="22" font-weight="700">From Indonesian text to an instruction-tuned model.</text>
  <path d="M115 144H875" stroke="#155e75" stroke-width="3" class="line"/>
  <circle cx="115" cy="144" r="5" fill="#22d3ee" filter="url(#ag)" class="dot"/>
  <g class="node"><circle cx="115" cy="144" r="29" fill="#071018" stroke="#164e63" stroke-width="2"/><text x="115" y="149" text-anchor="middle" class="m" fill="#22d3ee" font-size="12">DATA</text><text x="115" y="194" text-anchor="middle" class="m" fill="#94a3b8" font-size="11">~13B TOKENS</text></g>
  <g class="node d2"><circle cx="305" cy="144" r="29" fill="#071018" stroke="#164e63" stroke-width="2"/><text x="305" y="149" text-anchor="middle" class="m" fill="#22d3ee" font-size="11">BPE</text><text x="305" y="194" text-anchor="middle" class="m" fill="#94a3b8" font-size="11">32K VOCAB</text></g>
  <g class="node d3"><circle cx="495" cy="144" r="29" fill="#071018" stroke="#164e63" stroke-width="2"/><text x="495" y="149" text-anchor="middle" class="m" fill="#22d3ee" font-size="11">TRAIN</text><text x="495" y="194" text-anchor="middle" class="m" fill="#94a3b8" font-size="11">20K-STEP POC</text></g>
  <g class="node d4"><circle cx="685" cy="144" r="29" fill="#071018" stroke="#164e63" stroke-width="2"/><text x="685" y="149" text-anchor="middle" class="m" fill="#22d3ee" font-size="11">SFT</text><text x="685" y="194" text-anchor="middle" class="m" fill="#94a3b8" font-size="11">LoRA / PEFT</text></g>
  <g class="node d5"><circle cx="875" cy="144" r="29" fill="#071018" stroke="#164e63" stroke-width="2"/><text x="875" y="149" text-anchor="middle" class="m" fill="#22d3ee" font-size="11">EVAL</text><text x="875" y="194" text-anchor="middle" class="m" fill="#94a3b8" font-size="11">NEXT</text></g>
  <text x="500" y="228" text-anchor="middle" class="m" fill="#64748b" font-size="11">COLLECT → TOKENIZE → PRE-TRAIN → FINE-TUNE → EVALUATE</text>
</svg>
